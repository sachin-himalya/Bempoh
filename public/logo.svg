<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Main Gradient -->
    <linearGradient id="officialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC83"/>
      <stop offset="30%" stop-color="#E1BF66"/>
      <stop offset="65%" stop-color="#C7993B"/>
      <stop offset="100%" stop-color="#996A1E"/>
    </linearGradient>

    <!-- Metallic Gold Highlight Gradient -->
    <linearGradient id="officialGoldLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="40%" stop-color="#E2C268"/>
      <stop offset="100%" stop-color="#B88A2E"/>
    </linearGradient>

    <!-- Metallic Dark Shadow Gradient for sliced facets -->
    <linearGradient id="officialGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7993B"/>
      <stop offset="50%" stop-color="#8C5F19"/>
      <stop offset="100%" stop-color="#4F340B"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background (Transparent or Dark) -->
  <g transform="translate(400, 240)">
    
    <!-- THE OFFICIAL BEMPOH MONOGRAM "B" -->
    <!-- Top Segment: Upper Diagonal Wing of B -->
    <path d="M-65,-140 L-10,-140 C25,-140 55,-120 55,-85 C55,-55 35,-38 0,-25 L-65,-80 Z" 
          fill="url(#officialGoldLight)" />

    <!-- Middle Segment: Sliced Diagonal Bar of B -->
    <path d="M-65,-68 L12,-20 L-65,45 Z" 
          fill="url(#officialGoldDark)" />

    <!-- Bottom Segment: Smooth Curved Bowl of B -->
    <path d="M-65,58 L-5,10 C45,10 75,35 75,75 C75,115 40,140 -20,140 L-65,140 Z" 
          fill="url(#officialGold)" />

    <!-- Solid Spine Trim -->
    <path d="M-65,-140 L-45,-140 L-45,140 L-65,140 Z" 
          fill="url(#officialGold)" />

    <!-- Precision Diagonal Slash Gaps (Cutting negative space) -->
    <path d="M-70,-76 L25,-26 L20,-16 L-70,-66 Z" fill="#050505" />
    <path d="M-70,50 L5,2 L-2,10 L-70,60 Z" fill="#050505" />

  </g>

  <!-- OFFICIAL BEMPOH WORDMARK -->
  <g transform="translate(400, 460)">
    <text x="0" y="0" 
          text-anchor="middle" 
          fill="url(#officialGold)" 
          font-family="'Manrope', 'Inter', sans-serif" 
          font-weight="900" 
          font-size="64" 
          letter-spacing="16" 
          style="text-transform: uppercase;">
      BEMPOH
    </text>
  </g>
</svg>
